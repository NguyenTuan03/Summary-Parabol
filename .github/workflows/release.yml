name: Build and Release macOS App

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to release / attach assets (e.g. v1.2.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Inject Release Version into App
        env:
          TAG_VERSION: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          python -c "
          import os, re
          raw = os.environ.get('TAG_VERSION', '1.0.0')
          ver = raw.lstrip('v')
          print(f'Building version: {ver}')
          path = 'updater.py'
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'__version__ = \".*\"', f'__version__ = \"{ver}\"', content)
          with open(path, 'w') as f:
              f.write(content)
          print(f'Successfully injected version {ver} into {path}')
          "

      - name: Generate Icon and Build App Bundle
        run: |
          python make_icon.py
          pyinstaller "PR Report.spec" --noconfirm --clean

      - name: Package App Bundle into DMG
        env:
          TAG_VERSION: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
        run: |
          RAW="${TAG_VERSION:-v1.0.0}"
          if [[ "$RAW" == v* ]]; then
            TAG="$RAW"
          else
            TAG="v$RAW"
          fi
          DMG_NAME="PR-Report-${TAG}.dmg"
          echo "Packaging $DMG_NAME..."

          cd dist
          mkdir -p dmg_staging
          cp -R "PR Report.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "PR Report" -srcfolder dmg_staging -ov -format UDZO "$DMG_NAME"
          rm -rf dmg_staging

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.event.release.tag_name || github.ref_name }}
          files: |
            dist/PR-Report-*.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
