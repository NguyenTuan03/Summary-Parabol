name: Build and Release macOS App

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller pillow

      - name: Inject Release Version into App
        env:
          TAG_VERSION: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          python -c "
          import os, re
          raw = os.environ.get('TAG_VERSION', '1.0.0')
          ver = raw.lstrip('v')
          print(f'Building version: {ver}')
          path = 'updater.py'
          with open(path, 'r') as f:
              content = f.read()
          content = re.sub(r'__version__ = \".*\"', f'__version__ = \"{ver}\"', content)
          with open(path, 'w') as f:
              f.write(content)
          print(f'Successfully injected version {ver} into {path}')
          "

      - name: Generate Icon and Build App Bundle
        run: |
          python make_icon.py
          pyinstaller "PR Report.spec" --noconfirm --clean

      - name: Package App Bundle (DMG and ZIP)
        run: |
          cd dist
          # 1. Nén file ZIP (cho In-App Auto Update chạy nền)
          zip -r -y "PR-Report-macOS.zip" "PR Report.app"

          # 2. Tạo file DMG kéo thả cài đặt trực tiếp
          mkdir -p dmg_staging
          cp -R "PR Report.app" dmg_staging/
          ln -s /Applications dmg_staging/Applications
          hdiutil create -volname "PR Report" -srcfolder dmg_staging -ov -format UDZO "PR-Report.dmg"
          rm -rf dmg_staging

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PR-Report.dmg
            dist/PR-Report-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
